[project]
name = "therecode-backend"
version = "0.1.0"
description = "theReCode autonomous AI software-engineering platform backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.10.0",
    "certifi>=2024.0.0",
    "dnspython>=2.6.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "google-adk>=2.8.0",
    "google-genai>=2.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
scanners = [
    "ruff>=0.8.0",
    "semgrep>=1.76.0",
    "bandit>=1.8.0",
    "pytest>=8.3.0",
    "coverage>=7.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["fixtures"]
markers = [
    "integration: marks tests that require a running MongoDB instance",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/**" = ["I001"]
