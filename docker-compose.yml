name: therecode

services:
  mongodb:
    image: mongo:7
    container_name: therecode-mongodb
    ports:
      - "27017:27017"
    volumes:
      - therecode_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - therecode

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: therecode-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      THERECODE_MONGODB_URI: mongodb://mongodb:27017
      THERECODE_WORKSPACE_ROOT: /workspace
      THERECODE_CORS_ORIGINS: http://localhost:5173,http://localhost
    volumes:
      - ./workspace:/workspace
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - therecode

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: therecode-frontend
    ports:
      - "5173:8080"
    environment:
      PORT: "8080"
    volumes:
      # Local compose needs /api → backend; Cloud Run image is static-only.
      - ./frontend/nginx.compose.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - therecode

networks:
  therecode:
    driver: bridge

volumes:
  therecode_mongo_data:
