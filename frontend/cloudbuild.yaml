steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_API_BASE_URL=$_VITE_API_BASE_URL
      - -t
      - $_IMAGE
      - .

images:
  - $_IMAGE

substitutions:
  # Override on submit: full backend API prefix on Cloud Run
  _VITE_API_BASE_URL: https://therecode-backend-api-683080071974.europe-west1.run.app/api/v1
